name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: node --check web/tsvg-core.js && node --check web/tsvg-player.js && node --check web/tsvg-zip.js
      - run: node cli/tsvg.mjs validate examples/demo/demo.tsvg && node cli/tsvg.mjs validate examples/features/features.tsvg
      - run: node tests/unit.mjs && node cli/tsvg.mjs validate examples/libs/report.tsvg
      - run: node scripts/build-dist.mjs
      - run: deno check mod.ts
      - run: deno publish --dry-run --allow-dirty
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: node scripts/build-dist.mjs
      - run: deno publish --allow-dirty
