name: tsvg
description: >-
  TSVG (Timeseries Scalable Vector Graphics) engine for Dart and Flutter:
  parser, expression language, timeline, audio plan, .tsvgz packages, a
  CustomPainter renderer and a video player widget.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.0
  audioplayers: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
